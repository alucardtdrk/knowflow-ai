services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowflow
      POSTGRES_PASSWORD: knowflow_local
      POSTGRES_DB: knowflow
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow"]
      interval: 5s
      retries: 10
  storage:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: knowflow
      AWS_SECRET_ACCESS_KEY: knowflow_local_storage
      S3_BUCKET: knowflow
    ports: ["127.0.0.1:9000:8333"]
    volumes: [seaweedfs_local_data:/data]
volumes:
  postgres_data:
  seaweedfs_local_data:
